name: MuxCore
options:
  bundleIdPrefix: systems.zem
  deploymentTarget:
    iOS: "17.4"
  xcodeVersion: "15.0"
settings:
  SWIFT_VERSION: "5.9"
  DEVELOPMENT_TEAM: ""
targets:
  MuxCore:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "**/*.md"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: systems.zem.muxcore
      PRODUCT_NAME: MuxCore
      INFOPLIST_KEY_CFBundleDisplayName: MuxCore
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
      TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: MuxCore.entitlements
    info:
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: systems.zem.muxcore.auth
            CFBundleURLSchemes:
              - muxcore
